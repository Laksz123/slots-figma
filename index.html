<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slots — Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="desktop.css" />
</head>
<body>
  <!-- Full-viewport background -->
  <div class="bg">
    <div class="bg-img"></div>
    <div class="bg-grad"></div>
  </div>

  <div class="viewport desktop-root">
    <div class="frame" data-node-id="1:24">

      <!-- Settings + Music buttons -->
      <div class="top-btn" style="left:1276px; top:26px"><img src="assets/ic_music.svg" alt="music" /></div>
      <div class="top-btn" style="left:1350px; top:26px"><img src="assets/ic_settings.svg" alt="settings" /></div>

      <!-- Slot machine -->
      <div class="slot-outer"></div>
      <div class="slot-inner">
        <div class="grid-lines">
          <span class="v-line" style="left:156px; width:3px"></span>
          <span class="v-line" style="left:315px; width:2px"></span>
          <span class="v-line" style="left:473px; width:2px"></span>
          <span class="v-line" style="left:631px; width:2px"></span>
          <span class="h-line" style="top:155px; height:3px"></span>
          <span class="h-line" style="top:314px; height:2px"></span>
        </div>
      </div>

      <!-- Symbols grid -->
      <div class="sym-grid">
        <div class="cell"><img class="sym w-cherry" src="assets/cherry.png" alt=""></div>
        <div class="cell"><img class="sym w-plum" src="assets/plum.png" alt=""></div>
        <div class="cell"><img class="sym w-cherry" src="assets/cherry.png" alt=""></div>
        <div class="cell"><img class="sym w-plum" src="assets/plum.png" alt=""></div>
        <div class="cell"><img class="sym w-melon" src="assets/watermelon.png" alt=""></div>

        <div class="cell"><img class="sym w-banana" src="assets/banana.png" alt=""></div>
        <div class="cell"><img class="sym w-melon" src="assets/watermelon.png" alt=""></div>
        <div class="cell"><img class="sym w-plum" src="assets/plum.png" alt=""></div>
        <div class="cell"><img class="sym w-banana" src="assets/banana.png" alt=""></div>
        <div class="cell"><img class="sym w-ice" src="assets/ice.png" alt=""></div>

        <div class="cell"><img class="sym w-melon" src="assets/watermelon.png" alt=""></div>
        <div class="cell"><img class="sym w-ice" src="assets/ice.png" alt=""></div>
        <div class="cell"><img class="sym w-orange" src="assets/orange.png" alt=""></div>
        <div class="cell"><img class="sym w-cherry" src="assets/cherry.png" alt=""></div>
        <div class="cell"><img class="sym w-orange" src="assets/orange.png" alt=""></div>
      </div>

      <!-- Left card: BONUS BUY -->
      <div class="side-card left-card">
        <div class="lc-buy"><img src="assets/buy_desktop.svg" alt=""></div>
        <p class="lc-text">text text</p>
        <div class="lc-btn">BONUS BUY</div>
      </div>

      <!-- Right card: EXTRA CHANCE -->
      <div class="side-card right-card">
        <p class="rc-title">EXtra<br>CHANCE</p>
        <div class="rc-star"><img src="assets/star.svg" alt=""></div>
        <p class="rc-bet">BET: $0.6</p>
        <div class="rc-bar"><div class="rc-bar-fill"></div></div>
      </div>

      <!-- Ready to spin -->
      <div class="ready">
        <span class="ready-dot"><img src="assets/greendot.svg" alt=""></span>
        <span class="ready-text">Ready to spin</span>
      </div>

      <!-- Bottom control bar -->
      <div class="bar">
        <div class="box box-balance">
          <p class="lbl">Balance</p>
          <p class="val">$1 000 000</p>
        </div>

        <div class="lastwin">
          <p class="lbl gold">LAST WIN</p>
          <p class="val gold">$1000</p>
        </div>

        <div class="box box-bet">
          <p class="lbl gold bet-lbl">Bet</p>
          <div class="bet-row">
            <img class="bet-minus" src="assets/minus.svg" alt="">
            <p class="bet-val">$0.6</p>
            <img class="bet-plus" src="assets/plus.svg" alt="">
          </div>
        </div>

        <div class="spin">
          <p class="spin-title">SPIN</p>
          <p class="spin-sub">READY</p>
        </div>

        <div class="box box-turbo">
          <img class="turbo-ic" src="assets/turbo.svg" alt="">
          <p class="ctrl-lbl turbo-lbl">Turbo</p>
        </div>

        <div class="box box-auto">
          <img class="auto-ic" src="assets/auto.svg" alt="">
          <p class="ctrl-lbl auto-lbl">AUTO</p>
        </div>
      </div>

    </div>
  </div>

  <!-- ============ MOBILE LAYOUT ============ -->
  <div class="viewport mobile-root">
    <div class="m-frame">

      <!-- Top bar: settings/music -->
      <div class="m-top">
        <div class="m-topbtn"><img src="assets/ic_music.svg" alt=""></div>
        <div class="m-topbtn"><img src="assets/ic_settings.svg" alt=""></div>
      </div>

      <!-- Slot machine -->
      <div class="m-slot">
        <div class="m-slot-inner">
          <div class="grid-lines">
            <span class="v-line" style="left:20%; width:2px"></span>
            <span class="v-line" style="left:40%; width:1px"></span>
            <span class="v-line" style="left:60%; width:1px"></span>
            <span class="v-line" style="left:80%; width:1px"></span>
            <span class="h-line" style="top:33.33%; height:2px"></span>
            <span class="h-line" style="top:66.66%; height:1px"></span>
          </div>
          <div class="m-sym-grid">
            <div class="cell"><img class="sym" src="assets/cherry.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/plum.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/cherry.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/plum.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/watermelon.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/banana.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/watermelon.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/plum.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/banana.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/ice.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/watermelon.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/ice.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/orange.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/cherry.png" alt=""></div>
            <div class="cell"><img class="sym" src="assets/orange.png" alt=""></div>
          </div>
        </div>
      </div>

      <!-- Ready to spin -->
      <div class="m-ready">
        <span class="ready-dot"><img src="assets/greendot.svg" alt=""></span>
        <span class="ready-text">Ready to spin</span>
      </div>

      <!-- Bonus buy + Extra chance -->
      <div class="m-cards">
        <div class="m-card m-bonus">
          <img src="assets/buy_desktop.svg" alt="" class="m-buy-ic">
          <div class="m-bonus-btn">BONUS BUY</div>
        </div>
        <div class="m-card m-extra">
          <p class="m-extra-title">EXTRA<br>CHANCE</p>
          <img src="assets/star.svg" alt="" class="m-star">
          <p class="m-extra-bet">BET: $0.6</p>
        </div>
      </div>

      <!-- Info row -->
      <div class="m-info">
        <div class="m-box">
          <p class="lbl">Balance</p>
          <p class="val">$1 000 000</p>
        </div>
        <div class="m-box m-box-center">
          <p class="lbl gold">Last win</p>
          <p class="val gold">$1000</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="m-controls">
        <div class="m-box m-bet">
          <p class="lbl gold">Bet</p>
          <div class="bet-row">
            <img class="bet-minus" src="assets/minus.svg" alt="">
            <p class="bet-val">$0.6</p>
            <img class="bet-plus" src="assets/plus.svg" alt="">
          </div>
        </div>
        <div class="m-square m-turbo">
          <img class="turbo-ic" src="assets/turbo.svg" alt="">
          <p class="ctrl-lbl turbo-lbl">Turbo</p>
        </div>
        <div class="m-square m-auto">
          <img class="auto-ic" src="assets/auto.svg" alt="">
          <p class="ctrl-lbl auto-lbl">Auto</p>
        </div>
      </div>

      <!-- Spin -->
      <div class="m-spin">
        <p class="spin-title">SPIN</p>
        <p class="spin-sub">READY</p>
      </div>

    </div>
  </div>

  <script>
    function fit() {
      const isMobile = window.matchMedia('(max-width: 820px)').matches
                    || window.matchMedia('(orientation: portrait)').matches;
      const desk = document.querySelector('.desktop-root');
      const mob  = document.querySelector('.mobile-root');
      if (isMobile) {
        const f = mob.querySelector('.m-frame');
        const s = Math.min(window.innerWidth / 390, window.innerHeight / 800);
        f.style.transform = 'scale(' + s + ')';
      } else {
        const f = desk.querySelector('.frame');
        const s = Math.min(window.innerWidth / 1440, window.innerHeight / 1024);
        f.style.transform = 'scale(' + s + ')';
      }
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    fit();
  </script>
</body>
</html>
