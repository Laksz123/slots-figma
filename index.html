<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slots — Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="desktop.css" />
</head>
<body>
  <!-- Per-reel vertical motion-blur filters (stdDeviation y-axis driven from JS by reel velocity) -->
  <svg class="mb-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="mb0" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/></filter>
      <filter id="mb1" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/></filter>
      <filter id="mb2" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/></filter>
      <filter id="mb3" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/></filter>
      <filter id="mb4" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0" edgeMode="duplicate"/></filter>
    </defs>
  </svg>

  <div class="viewport desktop-root">
    <div class="frame" data-node-id="1:24">

      <!-- Background — exact Figma placement (node 1:25) -->
      <div class="bg">
        <div class="bg-img"></div>
        <div class="bg-grad"></div>
      </div>

      <!-- Settings + Music buttons -->
      <div class="top-btn" style="left:1276px; top:26px"><img src="assets/ic_music.svg" alt="music" /></div>
      <div class="top-btn" style="left:1350px; top:26px"><img src="assets/ic_settings.svg" alt="settings" /></div>

      <!-- Slot machine -->
      <div class="slot-outer"></div>
      <div class="slot-inner">
        <div class="sym-grid">
          <div class="reel" data-reel="0"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="1"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="2"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="3"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="4"><div class="reel-strip"></div></div>
        </div>
        <div class="grid-lines">
          <span class="v-line" style="left:156px; width:3px"></span>
          <span class="v-line" style="left:315px; width:2px"></span>
          <span class="v-line" style="left:473px; width:2px"></span>
          <span class="v-line" style="left:631px; width:2px"></span>
          <span class="h-line" style="top:155px; height:3px"></span>
          <span class="h-line" style="top:314px; height:2px"></span>
        </div>
      </div>

      <!-- Left card: BONUS BUY -->
      <div class="side-card left-card">
        <div class="lc-buy"><img src="assets/buy_desktop.svg" alt=""></div>
        <p class="lc-text">text text</p>
        <div class="lc-btn">BONUS BUY</div>
      </div>

      <!-- Right card: EXTRA CHANCE -->
      <div class="side-card right-card">
        <p class="rc-title">EXtra<br>CHANCE</p>
        <div class="rc-star"><img src="assets/star.svg" alt=""></div>
        <p class="rc-bet">BET: $0.6</p>
        <div class="rc-bar"><div class="rc-bar-fill"></div></div>
      </div>

      <!-- Ready to spin -->
      <div class="ready">
        <span class="ready-dot"><img src="assets/greendot.svg" alt=""></span>
        <span class="ready-text">Ready to spin</span>
      </div>

      <!-- Bottom control bar -->
      <div class="bar">
        <div class="box box-balance">
          <p class="lbl">Balance</p>
          <p class="val">$1 000 000</p>
        </div>

        <div class="lastwin">
          <p class="lbl gold">LAST WIN</p>
          <p class="val gold">$1000</p>
        </div>

        <div class="box box-bet">
          <p class="lbl gold bet-lbl">Bet</p>
          <div class="bet-row">
            <img class="bet-minus" src="assets/minus.svg" alt="">
            <p class="bet-val">$0.6</p>
            <img class="bet-plus" src="assets/plus.svg" alt="">
          </div>
        </div>

        <div class="spin">
          <p class="spin-title">SPIN</p>
          <p class="spin-sub">READY</p>
        </div>

        <div class="box box-turbo">
          <img class="turbo-ic" src="assets/turbo.svg" alt="">
          <p class="ctrl-lbl turbo-lbl">Turbo</p>
        </div>

        <div class="box box-auto">
          <img class="auto-ic" src="assets/auto.svg" alt="">
          <p class="ctrl-lbl auto-lbl">AUTO</p>
        </div>
      </div>

    </div>
  </div>

  <!-- ============ MOBILE LAYOUT (pixel-perfect, node 66:290, 390x760) ============ -->
  <div class="viewport mobile-root">
    <div class="m-frame">

      <!-- Background -->
      <div class="m-bg">
        <div class="m-bg-img"></div>
        <div class="m-bg-grad"></div>
      </div>

      <!-- Logo + jackpots -->
      <div class="m-logo"></div>
      <p class="m-logo-text">SlotUNO</p>
      <div class="m-jack m-jack-minor"><span class="jk-t">MINOR</span><span class="jk-v">100</span></div>
      <div class="m-jack m-jack-mini"><span class="jk-t">MINi</span><span class="jk-v">40</span></div>
      <div class="m-jack m-jack-grand"><span class="jk-t">GRAND</span><span class="jk-v">4.000</span></div>
      <div class="m-jack m-jack-major"><span class="jk-t">MAJOR</span><span class="jk-v">500</span></div>

      <!-- Slot -->
      <div class="m-slot-outer"></div>
      <div class="m-slot-inner">
        <div class="grid-lines">
          <span class="v-line" style="left:66px;  width:1px"></span>
          <span class="v-line" style="left:131px; width:1px"></span>
          <span class="v-line" style="left:196px; width:1px"></span>
          <span class="v-line" style="left:261px; width:1px"></span>
          <span class="h-line" style="top:64px;  height:1px"></span>
          <span class="h-line" style="top:129px; height:1px"></span>
        </div>
        <div class="m-reel-grid">
          <div class="reel" data-reel="0"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="1"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="2"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="3"><div class="reel-strip"></div></div>
          <div class="reel" data-reel="4"><div class="reel-strip"></div></div>
        </div>
      </div>

      <!-- Bonus buy -->
      <div class="m-bonusbuy">
        <img src="assets/m_buy.svg" alt="" class="m-bb-ic">
        <span class="m-bb-text">BONUS BUY</span>
      </div>

      <!-- Place your bet -->
      <div class="m-pyb-bar"></div>
      <p class="m-pyb-text">Place your bet</p>

      <!-- Control bar -->
      <div class="m-ctrl">
        <div class="m-cbtn m-menu">
          <span class="m-ham"></span><span class="m-ham"></span><span class="m-ham"></span>
        </div>
        <div class="m-cbtn m-ff"><img src="assets/m_ff.svg" alt=""></div>
        <div class="m-turbo-btn"><span>Hold for<br>turbo</span></div>
        <div class="m-cbtn m-coins"><img src="assets/m_coins.svg" alt=""></div>
        <div class="m-cbtn m-auto">
          <div class="m-auto-ic">
            <img class="m-auto-ellipse" src="assets/m_auto_ellipse.png" alt="">
            <span class="m-auto-a">A</span>
            <img class="m-auto-arc" src="assets/m_auto_arc.svg" alt="">
          </div>
        </div>
      </div>

      <!-- Bet / balance footer -->
      <p class="m-bet-foot">bet: $3</p>
      <p class="m-bal-foot">$ 1 000 000</p>

    </div>
  </div>

  <script>
    const symbols = {
      cherry: { src: 'assets/cherry.png', desktop: 'w-cherry', mobile: 'f-cherry' },
      plum: { src: 'assets/plum.png', desktop: 'w-plum', mobile: 'f-plum' },
      banana: { src: 'assets/banana.png', desktop: 'w-banana', mobile: 'f-banana' },
      melon: { src: 'assets/watermelon.png', desktop: 'w-melon', mobile: 'f-melon' },
      ice: { src: 'assets/ice.png', desktop: 'w-ice', mobile: 'f-ice' },
      orange: { src: 'assets/orange.png', desktop: 'w-orange', mobile: 'f-orange' }
    };

    const baseReels = [
      ['cherry', 'banana', 'melon'],
      ['plum', 'melon', 'ice'],
      ['cherry', 'plum', 'orange'],
      ['plum', 'banana', 'cherry'],
      ['melon', 'ice', 'orange']
    ];

    const reelPool = [
      ['cherry', 'orange', 'melon', 'banana', 'plum', 'ice'],
      ['plum', 'melon', 'ice', 'cherry', 'banana', 'orange'],
      ['orange', 'cherry', 'plum', 'melon', 'ice', 'banana'],
      ['banana', 'plum', 'cherry', 'ice', 'orange', 'melon'],
      ['melon', 'ice', 'orange', 'banana', 'cherry', 'plum']
    ];

    const results = [
      [
        ['cherry', 'banana', 'melon'],
        ['plum', 'melon', 'ice'],
        ['cherry', 'plum', 'orange'],
        ['plum', 'banana', 'cherry'],
        ['melon', 'ice', 'orange']
      ],
      [
        ['orange', 'cherry', 'banana'],
        ['banana', 'plum', 'orange'],
        ['melon', 'ice', 'cherry'],
        ['ice', 'orange', 'plum'],
        ['cherry', 'melon', 'banana']
      ],
      [
        ['melon', 'plum', 'ice'],
        ['orange', 'banana', 'cherry'],
        ['banana', 'melon', 'plum'],
        ['cherry', 'ice', 'orange'],
        ['plum', 'orange', 'melon']
      ],
      [
        ['ice', 'melon', 'cherry'],
        ['cherry', 'orange', 'melon'],
        ['plum', 'banana', 'ice'],
        ['melon', 'cherry', 'banana'],
        ['orange', 'plum', 'ice']
      ]
    ];

    let spinIndex = 1;
    let spinning = false;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const spinDistanceLoops = 8;   // rows of "junk" symbols flown past before landing (bigger = faster/blurrier middle)
    const spinDuration = 2100;     // base spin length for reel 0 (ms)
    const reelStagger = 150;       // each reel to the right spins this much longer -> stops L->R
    const spinStartDelay = 60;     // near-instant release after the click (no dead hover)
    const antiFrac = 0.15;         // fraction of the roll spent on the anticipation pull-up
    const backRows = 0.6;          // how far the reel back-winds UP (in rows) before dropping
    const accelFrac = 0.18;        // fraction of the DROP spent ramping up from a standstill
    const cruiseEndFrac = 0.72;    // fraction of the DROP at which cruise ends and braking begins
    const blurGain = 0.24;         // px of vertical blur per px/frame of reel velocity
    const blurCapFrac = 0.13;      // max blur as a fraction of one row height (higher = streakier fast middle)
    const blurFilters = [0, 1, 2, 3, 4].map((i) =>
      document.querySelector('#mb' + i + ' feGaussianBlur'));
    let currentReels = baseReels.map((reel) => reel.slice());

    function createSymbol(name, mode) {
      const item = document.createElement('div');
      item.className = 'reel-item';
      const img = document.createElement('img');
      img.className = 'sym ' + symbols[name][mode];
      img.src = symbols[name].src;
      img.alt = '';
      item.appendChild(img);
      return item;
    }

    function buildStrip(strip, reelIndex, startSet, finalSet, mode) {
      const fragment = document.createDocumentFragment();
      const pool = reelPool[reelIndex];
      const run = [];
      const runLength = spinDistanceLoops * pool.length;
      for (let i = 0; i < runLength; i += 1) {
        run.push(pool[(i + reelIndex + 1) % pool.length]);
      }
      // Top -> bottom order for a DOWNWARD spin (symbols fall in from the top):
      //   finalSet     = what lands in the window at rest (top of the strip)
      //   run          = junk symbols scrolled through
      //   startSet     = currently visible symbols (where the window sits at t=0)
      //   belowBuffer  = one extra symbol UNDER startSet, so the anticipation pull-up
      //                  never exposes a blank gap at the bottom edge of the reel
      const belowBuffer = pool[reelIndex % pool.length];
      const sequence = [...finalSet, ...run, ...startSet, belowBuffer];
      sequence.forEach((name) => fragment.appendChild(createSymbol(name, mode)));
      strip.replaceChildren(fragment);
      return sequence.length - 4; // rows from the start window (on startSet) down to rest (finalSet)
    }

    function buildStaticStrip(strip, visibleSet, mode) {
      const fragment = document.createDocumentFragment();
      visibleSet.forEach((name) => fragment.appendChild(createSymbol(name, mode)));
      strip.replaceChildren(fragment);
      strip.style.transform = 'translate3d(0, 0, 0)';
    }

    function setInitialReels() {
      document.querySelectorAll('.sym-grid .reel').forEach((reel, index) => {
        const strip = reel.querySelector('.reel-strip');
        buildStaticStrip(strip, currentReels[index], 'desktop');
      });

      document.querySelectorAll('.m-reel-grid .reel').forEach((reel, index) => {
        const strip = reel.querySelector('.reel-strip');
        buildStaticStrip(strip, currentReels[index], 'mobile');
      });
    }

    function waitFrame() {
      return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function prepareReel(reel, reelIndex, startSet, finalSet, mode) {
      const strip = reel.querySelector('.reel-strip');
      const travelRows = buildStrip(strip, reelIndex, startSet, finalSet, mode);
      // Position by the REAL rendered cell height, not reel.clientHeight/3. The reel's
      // content box is a couple of px shorter than three full cells (its border), so
      // clientHeight/3 is ~2px off per row — over the whole strip that mismatch snaps the
      // symbols by ~50px the instant the spin starts (the "teleport"). Measuring the cell
      // makes the start position line up exactly with the resting symbols -> no jump.
      const firstItem = strip.querySelector('.reel-item');
      const rowHeight = firstItem ? parseFloat(getComputedStyle(firstItem).height) : reel.clientHeight / 3;
      const startY = -travelRows * rowHeight; // window sits on startSet; rest window is at 0

      strip.getAnimations().forEach((animation) => animation.cancel());
      // Show the current symbols with no visible jump before the fall begins.
      strip.style.transform = 'translate3d(0, ' + startY + 'px, 0)';
      return { strip, reelIndex, rowHeight, startY, prevY: startY };
    }

    // Build the reel motion as one smooth position curve so the velocity is continuous
    // end-to-end (no lurch/teleport, no snap):
    //   1. anticipation  -> ease UP from rest to the top of the back-wind (velocity 0 at the top),
    //   2. drop          -> trapezoid fall (accel from standstill, steady cruise, soft stop).
    // Because velocity is 0 at the top of the back-wind AND at the start of the drop, the
    // reversal from "pull up" to "fall down" is seamless — the reference's start feel.
    function buildFallKeyframes(startY, rowHeight) {
      const D = -startY;                 // downward travel from rest-start to rest (positive)
      const back = rowHeight * backRows; // how far it pulls UP first
      const tup = antiFrac;              // portion of the roll spent on the pull-up
      const ta = accelFrac;              // accel ends (fraction of the DROP)
      const tb = cruiseEndFrac;          // cruise ends, braking begins (fraction of the DROP)
      const areaTotal = 0.5 * ta + (tb - ta) + 0.5 * (1 - tb);
      function posFrac(u) {               // fraction of the drop travelled, u in [0,1]
        let a;
        if (u <= ta)      a = 0.5 * u * u / ta;                     // accelerating
        else if (u <= tb) a = 0.5 * ta + (u - ta);                 // constant cruise
        else { const w = u - tb, W = 1 - tb;                        // braking
               a = 0.5 * ta + (tb - ta) + (w - 0.5 * w * w / W); }
        return a / areaTotal;
      }
      function smooth(x) { return x * x * (3 - 2 * x); } // ease-in-out, zero velocity at both ends
      const N = 48;
      const frames = [];
      for (let i = 0; i <= N; i += 1) {
        const u = i / N;
        let y;
        if (u <= tup) {
          // anticipation: rest -> top of the back-wind (up), coming to a stop at the top
          y = startY - back * smooth(u / tup);
        } else {
          // drop: top of the back-wind -> rest (0), travelling D + back
          const uf = (u - tup) / (1 - tup);
          y = (startY - back) + posFrac(uf) * (D + back);
        }
        frames.push({
          transform: 'translate3d(0, ' + y.toFixed(2) + 'px, 0)',
          offset: i / N,
          easing: 'linear'
        });
      }
      return frames;
    }

    function animatePreparedReel(prepared) {
      const { strip, reelIndex, rowHeight, startY } = prepared;
      // Reels fall DOWNWARD from startY (window on current symbols) to 0 (window on final symbols).
      if (reduceMotion.matches) {
        strip.style.transform = 'translate3d(0, 0, 0)';
        return Promise.resolve();
      }

      // Reels to the right spin a little longer, so the whole row settles left -> right.
      const duration = spinDuration + reelIndex * reelStagger;

      return strip.animate(
        buildFallKeyframes(startY, rowHeight),
        {
          duration: duration,
          delay: 0,
          easing: 'linear',
          fill: 'forwards'
        }
      ).finished.catch(() => {});
    }

    function readStripY(strip) {
      const t = getComputedStyle(strip).transform;
      if (!t || t === 'none') return 0;
      try { return new DOMMatrixReadOnly(t).m42; } catch (err) { return 0; }
    }

    // Vertical motion blur, driven each frame by how fast the reel is actually moving.
    // Blur peaks during the cruise and fades to zero as the reel brakes and settles.
    function runReelBlur(prepared) {
      let active = true;
      prepared.forEach((p) => {
        p.strip.style.filter = 'url(#mb' + p.reelIndex + ')';
        p.prevY = readStripY(p.strip);
      });

      function tick() {
        if (!active) return;
        prepared.forEach((p) => {
          const y = readStripY(p.strip);
          const velocity = Math.abs(y - p.prevY);
          p.prevY = y;
          const sigma = Math.min(velocity * blurGain, p.rowHeight * blurCapFrac);
          const f = blurFilters[p.reelIndex];
          if (f) f.setAttribute('stdDeviation', '0 ' + sigma.toFixed(2));
        });
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      return function stopBlur() {
        active = false;
        prepared.forEach((p) => {
          p.strip.style.filter = '';
          const f = blurFilters[p.reelIndex];
          if (f) f.setAttribute('stdDeviation', '0 0');
        });
      };
    }

    async function spinOnce() {
      if (spinning) return;
      spinning = true;
      document.body.classList.add('is-spin-pending');
      const final = results[spinIndex % results.length];
      spinIndex += 1;
      const isMobile = window.matchMedia('(max-width: 820px)').matches
                    || window.matchMedia('(orientation: portrait)').matches;
      const selector = isMobile ? '.m-reel-grid .reel' : '.sym-grid .reel';
      const mode = isMobile ? 'mobile' : 'desktop';

      await delay(spinStartDelay);
      document.body.classList.remove('is-spin-pending');
      document.body.classList.add('is-spinning');
      const prepared = Array.from(document.querySelectorAll(selector)).map((reel, index) =>
        prepareReel(reel, index, currentReels[index], final[index], mode)
      );

      await waitFrame();
      const stopBlur = reduceMotion.matches ? function () {} : runReelBlur(prepared);
      const animations = prepared.map(animatePreparedReel);

      await Promise.all(animations);
      stopBlur();
      currentReels = final.map((reel) => reel.slice());
      document.querySelectorAll(selector).forEach((reel, index) => {
        const strip = reel.querySelector('.reel-strip');
        strip.getAnimations().forEach((animation) => animation.cancel());
        buildStaticStrip(strip, currentReels[index], mode);
      });
      document.body.classList.remove('is-spinning');
      spinning = false;
    }

    function fit() {
      const isMobile = window.matchMedia('(max-width: 820px)').matches
                    || window.matchMedia('(orientation: portrait)').matches;
      if (isMobile) {
        const f = document.querySelector('.m-frame');
        const s = Math.min(window.innerWidth / 390, window.innerHeight / 760);
        f.style.transform = 'scale(' + s + ')';
      } else {
        const f = document.querySelector('.frame');
        const s = Math.min(window.innerWidth / 1440, window.innerHeight / 1024);
        f.style.transform = 'scale(' + s + ')';
      }
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    document.querySelectorAll('.spin, .m-turbo-btn, .box-turbo').forEach((button) => {
      button.addEventListener('click', spinOnce);
    });
    setInitialReels();
    fit();
    if (new URLSearchParams(window.location.search).has('autospin')) {
      setTimeout(spinOnce, 500);
    }
  </script>
</body>
</html>
